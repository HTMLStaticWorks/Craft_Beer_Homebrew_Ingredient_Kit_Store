<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Supply Co.</title>
  <meta name="description" content="Join the Supply Co. brewing community. Create your free account to access recipes, classes, and the Brew Club." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="alternate icon" type="image/png" href="assets/favicon-32x32.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/css/style.css?v=3" />
</head>
<body>

  <main id="main-content">
    <div class="auth-page" id="register-page">

      <!-- Auth Navigation Bar -->
      <nav class="auth-nav" aria-label="Authentication Navigation">
        <a href="index.html" class="auth-nav__back" aria-label="Back to Supply Co. Home">
          <i class="ph ph-arrow-left" aria-hidden="true"></i>
          <span>Back to Home</span>
        </a>
        <div class="auth-nav__actions">
          <!-- Theme Toggle -->
          <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark/light mode" data-theme-icon>
            <i class="ph ph-sun icon-sun" style="display:none"></i>
            <i class="ph ph-moon icon-moon"></i>
          </button>
          <!-- RTL Toggle -->
          <button class="rtl-toggle" data-rtl-toggle aria-label="Toggle RTL layout">
            <i class="ph ph-arrows-left-right"></i>
          </button>
        </div>
      </nav>

      <div class="auth-card" style="max-width:500px">

        <!-- Logo -->
        <a href="index.html" class="auth-card__logo" aria-label="Supply Co. Home">
          <div class="auth-card__logo-mark" aria-hidden="true">
            <i class="ph ph-beer-bottle"></i>
          </div>
          <div class="auth-card__logo-text">
            Supply Co.
            <span>Craft Homebrewing</span>
          </div>
        </a>

        <!-- Title -->
        <h1 class="auth-card__title">Create Account</h1>
        <p class="auth-card__subtitle">Join 4,800+ homebrewers today — free forever</p>

        <!-- Register Form -->
        <form id="register-form" novalidate aria-label="Create account form">

          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name</label>
            <input type="text" id="reg-name" name="name" class="form-input" placeholder="Your full name" autocomplete="name" required aria-required="true" />
            <div class="form-error" id="reg-name-error" role="alert" aria-live="polite"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <input type="email" id="reg-email" name="email" class="form-input" placeholder="your@email.com" autocomplete="email" required aria-required="true" />
            <div class="form-error" id="reg-email-error" role="alert" aria-live="polite"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <div class="form-input-wrap">
              <input type="password" id="reg-password" name="password" class="form-input" placeholder="Minimum 8 characters" autocomplete="new-password" required aria-required="true" minlength="8" />
              <button type="button" class="password-toggle-btn" aria-label="Show password" aria-pressed="false" data-toggle-password="reg-password" title="Show/hide password">
                <i class="ph ph-eye" aria-hidden="true"></i>
              </button>
            </div>
            <div class="form-error" id="reg-password-error" role="alert" aria-live="polite"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm">Confirm Password</label>
            <div class="form-input-wrap">
              <input type="password" id="reg-confirm" name="confirm" class="form-input" placeholder="Re-enter password" autocomplete="new-password" required aria-required="true" />
              <button type="button" class="password-toggle-btn" aria-label="Show password" aria-pressed="false" data-toggle-password="reg-confirm" title="Show/hide password">
                <i class="ph ph-eye" aria-hidden="true"></i>
              </button>
            </div>
            <div class="form-error" id="reg-confirm-error" role="alert" aria-live="polite"></div>
          </div>

          <div class="form-group">
            <label class="form-checkbox">
              <input type="checkbox" id="reg-terms" name="terms" required aria-required="true" />
              <span class="form-checkbox__label">
                I accept the <a href="#" tabindex="-1">Terms &amp; Conditions</a> and <a href="#" tabindex="-1">Privacy Policy</a>
              </span>
            </label>
            <div class="form-error" id="terms-error" role="alert" aria-live="polite">Please accept the Terms &amp; Conditions to continue.</div>
          </div>

          <button type="submit" class="btn btn--primary" style="width:100%;justify-content:center;margin-block-start:var(--space-2)" id="register-submit-btn">
            Create My Account
          </button>

          <div class="form-success" id="register-success-msg" role="status" aria-live="polite">
            <i class="ph ph-check-circle" aria-hidden="true"></i>
            Account created successfully! Welcome to Supply Co.
          </div>

        </form>

        <!-- Divider -->
        <div class="auth-divider">
          <div class="auth-divider__text">or register with</div>
        </div>

        <!-- Social Auth -->
        <div class="auth-social">
          <button class="auth-social-btn" id="google-register-btn" aria-label="Register with Google" type="button">
            <svg class="auth-social-btn__icon" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Continue with Google
          </button>

          <button class="auth-social-btn" id="apple-register-btn" aria-label="Register with Apple" type="button">
            <svg class="auth-social-btn__icon" viewBox="0 0 814 1000" aria-hidden="true" style="fill:currentColor">
              <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46.7 790.7 0 663 0 541.8c0-207.5 135.4-317.3 269-317.3 70.5 0 129.5 46.4 173.1 46.4 42.8 0 109.8-49.2 190.5-49.2z M770 141.7c0-26-3.5-52.7-10.4-78.2-37.3 0.5-80.5 24.8-106.5 54.3-23.9 26.8-44.4 68.7-44.4 110.5 0 30.5 4.3 54.5 12.1 71.3 49.3-2.6 96.1-37.8 126.7-76.9 17.1-22.4 22.5-46.4 22.5-81z"/>
            </svg>
            Continue with Apple
          </button>
        </div>

        <!-- Login Link -->
        <p class="auth-footer-link">
          Already have an account? <a href="login.html" id="goto-login-link">Log in here</a>
        </p>

      </div>

    </div>
  </main>

  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
