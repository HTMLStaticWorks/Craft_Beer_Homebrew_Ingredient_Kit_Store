<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Supply Co.</title>
  <meta name="description" content="Log in to your Supply Co. account to access your orders, recipes, and Brew Club membership." />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    /* Auth-page specific — no navbar, no toggle */
    .auth-page { background-color: var(--color-secondary); }
  </style>
</head>
<body>

  <main id="main-content">
    <div class="auth-page" id="login-page">

      <div class="auth-card">

        <!-- Logo -->
        <div class="auth-card__logo">
          <div class="auth-card__logo-mark" aria-hidden="true">
            <i class="ph ph-beer-bottle"></i>
          </div>
          <div class="auth-card__logo-text">Supply Co.</div>
        </div>

        <!-- Title -->
        <h1 class="auth-card__title">Welcome Back</h1>
        <p class="auth-card__subtitle">Log in to your brewing account</p>

        <!-- Login Form -->
        <form id="login-form" novalidate aria-label="Login form">

          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input type="email" id="login-email" name="email" class="form-input" placeholder="your@email.com" autocomplete="email" required aria-required="true" />
            <div class="form-error" id="login-email-error" role="alert" aria-live="polite"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">
              Password
              <a href="#" tabindex="-1" style="font-weight:400;color:var(--color-primary);font-size:var(--size-caption);float:right;text-decoration:none;font-family:var(--font-body)">Forgot password?</a>
            </label>
            <input type="password" id="login-password" name="password" class="form-input" placeholder="Minimum 8 characters" autocomplete="current-password" required aria-required="true" minlength="8" />
            <div class="form-error" id="login-password-error" role="alert" aria-live="polite"></div>
          </div>

          <button type="submit" class="btn btn--primary" style="width:100%;justify-content:center;margin-block-start:var(--space-2)" id="login-submit-btn">
            Login
          </button>

          <div class="form-success" id="login-success-msg" role="status" aria-live="polite">
            <i class="ph ph-check-circle" aria-hidden="true"></i>
            Login successful! Redirecting…
          </div>

        </form>

        <!-- Divider -->
        <div class="auth-divider">
          <div class="auth-divider__text">or continue with</div>
        </div>

        <!-- Social Auth -->
        <div class="auth-social">
          <button class="auth-social-btn" id="google-login-btn" aria-label="Continue with Google" type="button">
            <!-- Official Google icon SVG -->
            <svg class="auth-social-btn__icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
              <path fill="none" d="M0 0h48v48H0z"/>
            </svg>
            Continue with Google
          </button>

          <button class="auth-social-btn" id="apple-login-btn" aria-label="Continue with Apple" type="button">
            <!-- Official Apple icon SVG -->
            <svg class="auth-social-btn__icon" viewBox="0 0 814 1000" aria-hidden="true" focusable="false" style="fill:currentColor">
              <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46.7 790.7 0 663 0 541.8c0-207.5 135.4-317.3 269-317.3 70.5 0 129.5 46.4 173.1 46.4 42.8 0 109.8-49.2 190.5-49.2z M770 141.7c0-26-3.5-52.7-10.4-78.2-37.3 0.5-80.5 24.8-106.5 54.3-23.9 26.8-44.4 68.7-44.4 110.5 0 30.5 4.3 54.5 12.1 71.3 49.3-2.6 96.1-37.8 126.7-76.9 17.1-22.4 22.5-46.4 22.5-81z"/>
            </svg>
            Continue with Apple
          </button>
        </div>

        <!-- Register Link -->
        <p class="auth-footer-link">
          Don't have an account? <a href="register.html" id="goto-register-link">Create one — it's free</a>
        </p>

      </div>

    </div>
  </main>

  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
