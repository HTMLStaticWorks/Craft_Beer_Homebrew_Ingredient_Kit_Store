<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sc-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E59E4E"/>
      <stop offset="50%" stop-color="#C17B2A"/>
      <stop offset="100%" stop-color="#8F490B"/>
    </linearGradient>
    <linearGradient id="sc-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7EEDF"/>
    </linearGradient>
    <filter id="sc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="32" cy="32" r="30" fill="url(#sc-amber)"/>
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="#FDE5C5" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Beer Bottle Silhouette -->
  <g filter="url(#sc-shadow)">
    <!-- Crown Cap -->
    <rect x="28" y="10" width="8" height="3.5" rx="1" fill="url(#sc-glass)"/>
    <!-- Bottle Outline & Body -->
    <path d="M29 13.5 H35 V21 C35 25.5 41.5 28.5 42 33.5 V48 C42 50.8 39.8 53 37 53 H27 C24.2 53 22 50.8 22 48 V33.5 C22.5 28.5 29 25.5 29 21 Z" fill="url(#sc-glass)"/>
    <!-- Label -->
    <rect x="23.2" y="34.5" width="17.6" height="11" rx="1" fill="#1E1E1E"/>
    <!-- Hop / Craft Motif on Label -->
    <path d="M32 36.8 C33.8 38.3 35.5 39.8 35 41.5 C34.5 43 33.3 43.8 32 44.2 C30.7 43.8 29.5 43 29 41.5 C28.5 39.8 30.2 38.3 32 36.8 Z" fill="#E59E4E"/>
    <circle cx="32" cy="39.2" r="1.1" fill="#FFFFFF"/>
  </g>
</svg>
